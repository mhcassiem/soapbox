[tool.poetry]
name = "app"
version = "0.1.0"
description = "A FastAPI + GraphQL blog backend with password and Google authentication"
authors = ["Your Name <you@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = ">=3.11, <4.0"

# Core framework
fastapi = "^0.110.0"
uvicorn = {extras = ["standard"], version = "^0.29.0"}

# GraphQL
strawberry-graphql = {extras = ["fastapi"], version = "^0.219.2"}

# ORM
sqlalchemy = "^2.0.30"

# Auth
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
authlib = {extras = ["httpx"], version = "^1.3.0"}

# HTTP client (used by Authlib)
httpx = "^0.27.0"

# Env var loading
python-dotenv = "^1.0.1"
pydantic-settings = "^2.9.1"
itsdangerous = "^2.2.0"
pydantic = {extras = ["email"], version = "^2.11.7"}

[tool.poetry.group.dev.dependencies]
black = "^24.4.2"
isort = "^5.13.2"
pytest = "^8.2.0"
ruff = "^0.11.13"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
